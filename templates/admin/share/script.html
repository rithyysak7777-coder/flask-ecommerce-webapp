<script src="{{ url_for('static', filename='script/theme.js') }}"></script>
<script>
  const sidebar = document.getElementById("adminSidebar");
  const toggle = document.getElementById("sidebarToggle");
  const backdrop = document.getElementById("sidebarBackdrop");

  function closeSidebar() {
    sidebar.classList.remove("is-open");
    backdrop.classList.remove("is-visible");
  }

  toggle.addEventListener("click", function () {
    sidebar.classList.toggle("is-open");
    backdrop.classList.toggle("is-visible");
  });

  backdrop.addEventListener("click", closeSidebar);

  const modal = document.getElementById("deleteModal");
  const modalText = document.getElementById("deleteModalText");
  const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
  const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
  let deleteTarget = null;

  document.querySelectorAll(".delete-user-btn").forEach((button) => {
    button.addEventListener("click", () => {
      deleteTarget = button.getAttribute("data-user");
      modalText.textContent = `Are you sure you want to delete ${deleteTarget}?`;
      modal.style.display = "flex";
    });
  });

  cancelDeleteBtn.addEventListener("click", () => {
    modal.style.display = "none";
    deleteTarget = null;
  });

  confirmDeleteBtn.addEventListener("click", () => {
    if (deleteTarget) {
      alert(`${deleteTarget} deleted`);
    }
    modal.style.display = "none";
    deleteTarget = null;
  });

  function loadFile(event) {
    var output = document.getElementById("output");
    output.src = URL.createObjectURL(event.target.files[0]);
    output.onload = function () {
      URL.revokeObjectURL(output.src);
    };
  }

  // Admin User Dropdown Toggle
  const adminUserTrigger = document.getElementById("adminUserTrigger");
  const adminUserMenu = document.getElementById("adminUserMenu");

  if (adminUserTrigger && adminUserMenu) {
    adminUserTrigger.addEventListener("click", function (e) {
      e.stopPropagation();
      const isExpanded = adminUserTrigger.getAttribute("aria-expanded") === "true";
      adminUserTrigger.setAttribute("aria-expanded", String(!isExpanded));
      adminUserMenu.classList.toggle("show");
    });

    document.addEventListener("click", function (e) {
      if (!adminUserMenu.contains(e.target) && !adminUserTrigger.contains(e.target)) {
        adminUserMenu.classList.remove("show");
        adminUserTrigger.setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        adminUserMenu.classList.remove("show");
        adminUserTrigger.setAttribute("aria-expanded", "false");
      }
    });
  }

  // Fullscreen Toggle
  const fullscreenToggle = document.getElementById("fullscreenToggle");
  if (fullscreenToggle) {
    fullscreenToggle.addEventListener("click", function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    });
  }
</script>
